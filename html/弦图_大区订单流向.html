<div id="tip">悬停弦带或大区弧段查看明细</div>
<div class="note">数据口径：常住大区（客户订单最多的区）× 订单所在大区，2023-2026 实测统计。纯 SVG 绘制，无外部依赖。</div>
<script>
(function(){
  var ribbons=document.querySelectorAll('.ribbon');
  var arcs=document.querySelectorAll('.arc');
  var tip=document.getElementById('tip');
  function dim(except){
    ribbons.forEach(function(p){ if(p!==except) p.style.opacity='0.12'; });
    arcs.forEach(function(p){ if(p!==except) p.style.opacity='0.3'; });
  }
  function restore(){
    ribbons.forEach(function(p){ p.style.opacity=''; });
    arcs.forEach(function(p){ p.style.opacity=''; });
  }
  ribbons.forEach(function(p){
    p.addEventListener('mouseover',function(){
      dim(p);
      tip.innerHTML='<b>'+p.getAttribute('data-a')+' → '+p.getAttribute('data-b')+'</b><br/>'+p.getAttribute('data-v')+' 个订单';
    });
    p.addEventListener('mouseout',function(){ restore(); tip.innerHTML='悬停弦带或大区弧段查看明细'; });
  });
  arcs.forEach(function(p){
    p.addEventListener('mouseover',function(){
      dim(p);
      var r=p.getAttribute('data-r');
      var rel=document.querySelectorAll('.ribbon[data-a="'+r+'"],.ribbon[data-b="'+r+'"]');
      rel.forEach(function(q){ q.style.opacity='0.85'; });
      tip.innerHTML='<b>'+r+'</b><br/>'+p.getAttribute('data-v')+' 个订单';
    });
    p.addEventListener('mouseout',function(){ restore(); tip.innerHTML='悬停弦带或大区弧段查看明细'; });
  });
})();
</script>
