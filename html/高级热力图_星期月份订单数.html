<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高级热力图 · 星期×月份订单数</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",sans-serif;color:#e8f0ff;background:#070c1a;
       min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:22px;background:linear-gradient(90deg,#5ab8ff,#8ff0be);
     -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;}
  .sub{font-size:12.5px;color:#8fa3c4;margin-bottom:6px;}
  #chart{width:960px;height:480px;max-width:96vw;}
  .note{font-size:11px;color:#8fa3c4;margin-top:12px;max-width:820px;text-align:center;}
</style>
</head>
<body>
<h1>订单活跃 · 高级热力图（星期 × 月份）</h1>
<div class="sub">颜色越亮订单越多 · ★ = 高峰格（>72% 峰值）· 悬停查看具体数值</div>
<div id="chart"></div>
<div class="note">数据口径：Sample Superstore 订单按 星期×月份 聚合实测统计。</div>
<script>
(function(){
  var chart=echarts.init(document.getElementById('chart'));
  var days=["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  var months=["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
  var data=[[0, 0, 29], [1, 0, 35], [2, 0, 83], [3, 0, 53], [4, 0, 97], [5, 0, 84], [6, 0, 79], [7, 0, 64], [8, 0, 139], [9, 0, 127], [10, 0, 187], [11, 0, 143], [0, 1, 49], [1, 1, 54], [2, 1, 136], [3, 1, 143], [4, 1, 119], [5, 1, 129], [6, 1, 153], [7, 1, 117], [8, 1, 239], [9, 1, 176], [10, 1, 215], [11, 1, 311], [0, 2, 89], [1, 2, 51], [2, 2, 92], [3, 2, 92], [4, 2, 131], [5, 2, 127], [6, 2, 144], [7, 2, 112], [8, 2, 249], [9, 2, 151], [10, 2, 242], [11, 2, 278], [0, 3, 73], [1, 3, 43], [2, 3, 107], [3, 3, 146], [4, 3, 108], [5, 3, 125], [6, 3, 109], [7, 3, 106], [8, 3, 255], [9, 3, 117], [10, 3, 251], [11, 3, 226], [0, 4, 113], [1, 4, 60], [2, 4, 144], [3, 4, 95], [4, 4, 152], [5, 4, 133], [6, 4, 127], [7, 4, 167], [8, 4, 274], [9, 4, 163], [10, 4, 268], [11, 4, 263], [0, 5, 41], [1, 5, 34], [2, 5, 111], [3, 5, 103], [4, 5, 95], [5, 5, 89], [6, 5, 71], [7, 5, 124], [8, 5, 162], [9, 5, 89], [10, 5, 209], [11, 5, 158], [0, 6, 10], [1, 6, 23], [2, 6, 38], [3, 6, 38], [4, 6, 56], [5, 6, 38], [6, 6, 35], [7, 6, 32], [8, 6, 81], [9, 6, 20], [10, 6, 102], [11, 6, 91]];
  var maxV=311;
  var COLORS=['#0b1833','#123a6e','#1f6fb2','#2f8fd0','#5ab8ff','#8ff0be','#ffe28a'];
  chart.setOption({
    tooltip:{position:'top',
      formatter:function(p){
        return days[p.value[1]]+' '+months[p.value[0]]+'<br/>订单数：<b>'+p.value[2]+'</b>';
      }},
    grid:{left:70,right:20,top:30,bottom:60},
    xAxis:{type:'category',data:months,axisLabel:{color:'#9fc6ff',fontSize:11},splitArea:{show:true}},
    yAxis:{type:'category',data:days,axisLabel:{color:'#cfe1ff',fontSize:12},splitArea:{show:true}},
    visualMap:{min:0,max:maxV,calculable:true,orient:'horizontal',left:'center',bottom:5,
      inRange:{color:COLORS},textStyle:{color:'#9fc6ff'}},
    series:[{type:'heatmap',data:data,
      label:{show:true,color:'#fff',fontSize:12,fontWeight:'bold',
        formatter:function(p){return p.value[2]>maxV*0.72?'★':'';}},
      emphasis:{itemStyle:{shadowBlur:12,shadowColor:'rgba(90,150,255,.6)'}}}]
  });
  window.addEventListener('resize',function(){chart.resize();});
})();
</script>
</body>
</html>
