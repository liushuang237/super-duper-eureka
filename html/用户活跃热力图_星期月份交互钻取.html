<title>用户活跃热力图 · 星期×月份交互钻取</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",sans-serif;color:#e8f0ff;background:#070c1a;min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:22px;background:linear-gradient(90deg,#5ab8ff,#8ff0be);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;}
  .sub{font-size:12.5px;color:#8fa3c4;margin-bottom:6px;}
  .tabs{display:flex;gap:10px;margin-bottom:14px;}
  .tabs button{padding:8px 18px;border:1px solid #3a5b95;background:#10234a;color:#cfe1ff;border-radius:8px;cursor:pointer;font-size:13px;}
  .tabs button.on{background:linear-gradient(180deg,#2a5bb0,#1a3d80);border-color:#5ab8ff;color:#fff;font-weight:bold;}
  #chart{width:900px;height:460px;max-width:96vw;}
  .note{font-size:11px;color:#8fa3c4;margin-top:14px;max-width:820px;text-align:center;}
</style>
</head>

<h1>电商用户活跃热力图 · 星期 × 月份</h1>
<div class="sub">同一指标在不同星期与月份的分布密度 · 点击切换指标下钻</div>
<div class="tabs">
  <button class="on" data-k="sales">销售额 Sales</button>
  <button data-k="profit">利润 Profit</button>
  <button data-k="qty">数量 Quantity</button>
</div>
<div id="chart"></div>
<div class="note">数据口径：基于 Sample Superstore 订单数据（2014-2017）按 星期×月份 聚合实测统计。深色格=数值高，用于定位销售与利润的最佳时段。</div>

  var keyName={sales:'销售额',profit:'利润',qty:'数量'};
  var MAXV=68237;
  function render(key){
    chart.setOption({
      tooltip:{position:'top',formatter:function(p){
        return days[p.value[1]]+' '+months[p.value[0]]+'<br/>'+keyName[key]+'：'+p.value[2];
      }},
      grid:{left:50,right:20,top:20,bottom:60},
      xAxis:{type:'category',data:months,axisLabel:{color:'#9fc6ff',interval:0},splitArea:{show:true}},
      yAxis:{type:'category',data:days,axisLabel:{color:'#cfe1ff'},splitArea:{show:true}},
      visualMap:{min:0,max:MAXV,calculable:true,orient:'horizontal',left:'center',bottom:5,
        inRange:{color:['#0b1833','#123a6e','#1f6fb2','#5ab8ff','#8ff0be','#ffe28a']},
        textStyle:{color:'#9fc6ff'}},
      series:[{type:'heatmap',data:dataByKey[key],label:{show:false},
        emphasis:{itemStyle:{shadowBlur:12,shadowColor:'rgba(90,150,255,.6)'}}}]
    },true);
  }
  render('sales');
  var btns=document.querySelectorAll('.tabs button');
  btns.forEach(function(b){
    b.onclick=function(){
      btns.forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      render(b.getAttribute('data-k'));
    };
  });
  window.addEventListener('resize',function(){chart.resize();});
})();

</html>
